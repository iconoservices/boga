<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Tecnología: celulares, laptops y accesorios">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <pattern id="rejilla" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" fill="url(#fondo)"/>
  <rect width="1200" height="520" fill="url(#rejilla)"/>
  <!-- circuito -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 420H260L320 360H520"/>
    <path d="M60 470H340L400 410H640"/>
    <path d="M700 90H900L960 150H1140"/>
    <path d="M760 40H980L1040 100H1160"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="520" cy="360" r="8"/><circle cx="640" cy="410" r="8"/><circle cx="1140" cy="150" r="8"/><circle cx="1160" cy="100" r="8"/>
  </g>
  <!-- celular -->
  <g transform="translate(700 120) rotate(8)">
    <rect width="190" height="340" rx="30" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/>
    <rect x="14" y="18" width="162" height="304" rx="20" fill="#1e40af"/>
    <rect x="14" y="18" width="162" height="304" rx="20" fill="url(#fondo)" opacity="0.6"/>
    <circle cx="95" cy="170" r="46" fill="none" stroke="#bfdbfe" stroke-width="6"/>
    <circle cx="95" cy="170" r="16" fill="#bfdbfe"/>
    <rect x="70" y="26" width="50" height="9" rx="4.5" fill="#0f172a"/>
  </g>
  <!-- laptop -->
  <g transform="translate(930 250)">
    <rect x="20" y="0" width="230" height="150" rx="12" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/>
    <rect x="34" y="14" width="202" height="122" rx="6" fill="#2563eb"/>
    <path d="M0 160H270L252 184H18Z" fill="#334155" stroke="#93c5fd" stroke-width="3"/>
  </g>
</svg>
